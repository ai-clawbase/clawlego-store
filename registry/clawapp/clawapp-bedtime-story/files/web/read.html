<!-- 念故事 —— 对外那一屏。收到链接的人打开就是这个。 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>念故事</title>
<link rel="stylesheet" href="app.css">
<script src="/clawapp.js"></script>

<main>
  <div id="index">
    <h1>念故事</h1>
    <p class="sub" id="sub">…</p>
    <div id="list" class="list"></div>
  </div>

  <div id="reader" style="display:none">
    <div class="title" id="title"></div>
    <div class="page" id="page"></div>
    <div class="pager" id="pager"></div>
    <div class="row">
      <button class="ghost" id="prev">上一页</button>
      <button id="next">下一页</button>
    </div>
    <div class="row"><button class="ghost" id="back">回列表</button></div>
  </div>
</main>

<script src="app.js"></script>
<script>
let stories = []
let pages = []
let at = 0

async function load() {
  // 走函数而不是 entity.query：公网面读不到记录，能读什么由 shared.risor 说了算。
  const res = await run('shared')
  if (!res.ok) {
    $('#sub').textContent = ''
    $('#list').innerHTML = `<div class="empty">${res.error}</div>`
    return
  }
  stories = payload(res).stories || []
  if (!stories.length) {
    $('#sub').textContent = ''
    $('#list').innerHTML = `<div class="empty">还没有分享出来的故事。</div>`
    return
  }
  $('#sub').textContent = `${stories.length} 个故事，点开就能念`
  $('#list').innerHTML = stories.map((s, i) => `
    <div class="item" data-i="${i}">
      <b>${s.title || '故事'}</b>
      <div>${s.date || ''}</div>
    </div>`).join('')
  for (const el of document.querySelectorAll('.item')) {
    el.onclick = () => open(stories[Number(el.dataset.i)])
  }
}

function open(s) {
  pages = Array.isArray(s.pages) ? s.pages : []
  at = 0
  $('#title').textContent = s.title || '故事'
  $('#index').style.display = 'none'
  $('#reader').style.display = 'block'
  show()
}

function show() {
  $('#page').textContent = pages[at] || ''
  $('#pager').textContent = `${at + 1} / ${pages.length}`
  $('#prev').disabled = at === 0
  $('#next').disabled = at >= pages.length - 1
  read(pages[at])
}

$('#next').onclick = () => { if (at < pages.length - 1) { at++; show() } }
$('#prev').onclick = () => { if (at > 0) { at--; show() } }
$('#back').onclick = () => {
  clawapp.speech.stop()
  $('#reader').style.display = 'none'
  $('#index').style.display = 'block'
}

// 这一屏被外壳保活，所以每次重新显示都刷新一遍——否则主人刚分享的故事看不到。
clawapp.ready().then(() => { load(); clawapp.onShow(() => { if ($('#index').style.display !== 'none') load() }) })
</script>
