apiVersion: app.clawlego.com/v1
kind: LightApp
metadata:
  name: homework_coach
  version: 1.1.0

# 作业陪练 —— 和市面上所有「拍照搜答案」反着做。
#
# 那类工具解决的是孩子的问题（这题答案是什么），而家长真正的问题是「我讲不明白，
# 又不想直接告诉他答案」。所以这个应用的硬约束是：**永远不给答案**，只给一层一
# 层的提示阶梯，孩子每次只多知道一点点。
#
# 技术上它是 media + vision 那条链路的范例：clawapp.media.save 拿到不透明 id，
# 存进记录，函数把同一个 id 直接交给 ctx.ai.vision——脚本从头到尾不知道文件在哪。
spec:
  display:
    name: 作业陪练
    icon: carbon:pen
    description: 拍下不会的那道题，它不给答案，只一层层给提示，陪孩子自己想出来
    color: "#2f9e6e"
  category: life

  entities:
    - { name: question, schema: entities/question.json }

  functions:
    - { name: coach, script: functions/coach.risor, summary: 看题目，出提示阶梯 }
    - { name: check, script: functions/check.risor, summary: 看孩子的答案对不对 }

  web: { entry: web/index.html }

  # 对外只有拍题那一屏。记录是孩子做过哪些题、哪类反复卡住——那是家长看的，
  # 不该跟着链接发出去。
  pages:
    - { name: ask,     path: index.html,   title: 拍题 }
    - { name: history, path: history.html, title: 记录, visibility: owner }

  tabbar:
    selected_color: "#2f9e6e"
    items:
      - { page: ask,     label: 拍题, icon: edit }
      - { page: history, label: 记录, icon: list }

  target: mobile

  # 这是四个里最该对外的一个：孩子自己拿手机拍下卡住的那道题，家长不必在场。
  # 所以它也是唯一同时要求「公网能调模型」和「公网能上传」的应用——两样都要
  # 单独声明，而且各自带自己的上限。
  public:
    enabled: true
    actions:
      - { name: coach, rate: "6/min" }
      - { name: check, rate: "12/min" }
    media:
      enabled: true
      # 一张手机照片，不是一段视频。
      max_bytes: 6291456
      daily_uploads: 60

  ai:
    enabled: true
    safety: child
    budget:
      # 看图比纯文本贵不少，额度给得比识字卡宽。
      daily_tokens: 150000
    public:
      enabled: true
      # 对外那份额度是独立记的：外人刷爆的是这 20000，不是主人的 150000。
      # 一次看图陪练大约几千 token，所以这够几个孩子用一天，又不至于把主人的
      # 账单打穿。
      daily_tokens: 20000
